{% load static %}
<html lang='pt'>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, initial-scale=1' />
	<script src='https://kit.fontawesome.com/50797efa34.js'></script>
	<link rel='stylesheet' type='text/css' href='{% static "css/base.css" %}'>
	<link rel='stylesheet' type='text/css' href='{% static "css/form.css" %}'>
	<link rel='stylesheet' type='text/css' href='{% static "css/list.css" %}'>
	<link rel='stylesheet' type='text/css' href='https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css' crossorigin='anonymous'>
	<script src='https://code.jquery.com/jquery-3.3.1.slim.min.js'></script>
	<script src='https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js'></script>
	<script src='https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js'></script>
	<script type='text/javascript' src='{% static "javascript/mask.js" %}'></script>
	<script type='text/javascript' src='{% static "javascript/search.js" %}'></script>
	<script type='text/javascript' src='{% static "javascript/validate.js" %}'></script>
	<title class='col-lg-12 text-center'>CEASA</title>
</head>
<body>
	<nav class='navbar navbar-expand-lg navbar-dark static-top'>
		<div class='container-fluid'>
			<div class='navbar-header'>
				<div class='navbar-brand'>
					<img src='{% static "assets/logo.png" %}' class='rounded mx-auto d-block' alt='Logo do CEASA'>
				</div>
			</div>
			<ul class='nav justify-content-center'>
				<div class='form-row'>
					<div class='col'>
						<li class='nav-item dropdown'>
							<button class='btn btn-primary btn-lg dropdown-toggle' type='button' id='cadastro' data-toggle='dropdown' aria-haspopup='true' aria-expanded='true'>Cadastros</button>
							<div class='dropdown-menu' aria-labelledby='cadastro'>
								<a class='dropdown-item' href='{% url "schoollist" %}'>Escolas</a>
								<a class='dropdown-item' href='{% url "stocklist" %}'>Estoque</a>
								<a class='dropdown-item' href='{% url "productlist" %}'>Produtos</a>
								<a class='dropdown-item' href='{% url "userlist" %}'>Usuários</a>
							</div>
						</li>
					</div>
					<div class='col'>
						<li class='nav-item dropdown'>
							<button class='btn btn-info btn-lg dropdown-toggle' type='button' id='relatorio' data-toggle='dropdown' aria-haspopup='true' aria-expanded='false'>Relatórios</button>
							<div class='dropdown-menu' aria-labelledby='relatorio'>
								<a class='dropdown-item' href='#'>Estoque por escola</a>
								<a class='dropdown-item' href='#'>Estoque mínimo por escola</a>
								<a class='dropdown-item' href='#'>Inventário</a>
							</div>
						</li>
					</div>
					<div class='col'>
						<li class='nav-item'>
							<a class='nav-link' href='{% url "logout" %}'><i class='fas fa-sign-out-alt'></i></a>
						</li>
					</div>
				</div>
			</ul>
		</div>
	</nav>
	<div class='container overflow-hidden' style='height: 90%;'>
		<div class='row'>
			<div class='col-lg-12'>
				{% block pagina %}
				{% endblock %}
			</div>
		</div>
	</div>
	<footer class='container-fluid text-right' style='height: 10%;'>
		<p>&copy; Copyright 2020 CEASA</p>
	</footer>
</body>
</html>
