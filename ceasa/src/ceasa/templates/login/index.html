{% load static %}
<html lang='pt'>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, initial-scale=1' />
	<link rel='stylesheet' type='text/css' href='{% static "css/login.css" %}'>
	<link rel='stylesheet' type='text/css' href='https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css' crossorigin='anonymous'>
	<script src='https://code.jquery.com/jquery-3.3.1.slim.min.js'></script>
	<script src='https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js'></script>
	<script src='https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js'></script>
	<script type='text/javascript' src='{% static "javascript/mask.js" %}'></script>
	<title class='col-lg-12 text-center'>CEASA</title>
</head>
<body>
	<div class='background'>
		{% if erro is not None %}
            <div class='error-overlay' onclick='this.style.display="none"'>
                <div class='error-popup' onclick='this.parentElement.style.display="none"'>
                    <h2>Aviso</h2>
                    <button class='error-close'>&times;</button>
                    <div class='error-content'>
                        <p>{{ erro }}</p>
                    </div>
                </div>
            </div>
        {% endif %}
		<div class='content'>
			<div class='container'>
				<div class='form'>
					<div class='card'>
						<div class='card-body'>
							<header>
								<img src='{% static "assets/logo.png" %}' class='rounded mx-auto d-block' />
							</header>
							{% block formulario %}
								<form method='post' action='.' autocomplete='off'>
								{% csrf_token %}
									<div class='form-group'>
										<label for='cpf'>CPF</label>
										<input 
											type='text' 
											class='form-control' 
											id='cpf'
											name='cpf'
											placeholder='Preencha com o seu CPF'
											value='{{ form.cpf }}'
											maxlength='14'
											required
											pattern='[0-9]{3}[\.][0-9]{3}[\.][0-9]{3}[-][0-9]{2}'
											onkeypress='mascaraCPF(this)'
											oninput='setCustomValidity("")'
											oninvalid='setCustomValidity("Preencher com o formato padrao de CPF")'  
										/>
									</div>
									<div class='form-group'>
										<label for='senha'>Senha</label>
										<input 
											type='password' 
											class='form-control'
											id='senha' 
											name='senha'
											maxlength='100'
											placeholder='Preencha com a sua senha' 
											value='{{ form.senha }}'
											required
											oninput='setCustomValidity("")'
											oninvalid='setCustomValidity("Preencher campo obrigatório")' 
										/>
										<small 
											class='form-text text-muted'
										>
											Não compartilhe seus dados com ninguém
										</small>
									</div>
									<button type='button' class='btn btn-link' onclick='window.location.href=`{% url "changepassword" %}`'>Esqueci minha senha</button>
									<button type='submit' class='btn btn-success btn-lg btn-block'>Entrar</button>
								</form>
							{% endblock %}
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
<script>
	$('form').on('submit', function() {
        $('button[type="submit"]').attr('disabled', true);
        return true;
    });
</script>
</html>
