{% extends 'login/index.html' %}
{% load static %}

{% block formulario %}

{% if erro is not None %}
	<div class='error-overlay' onclick='this.style.display="none"'>
		<div class='error-popup' onclick='this.parentElement.style.display="none"'>
			<h2>Aviso</h2>
			<button aria-label='Fechar' class='error-close'>&times;</button>
			<div class='error-content'>
				<p>{{ erro }}</p>
			</div>
		</div>
	</div>
{% endif %}

<form method='post' action='.' autocomplete='off'>
	{% csrf_token %}
		<div class='form-group'>
			<label for='cpf'>CPF</label>
			<input 
				type='text' 
				class='form-control' 
				id='cpf'
				name='cpf'
				placeholder='Preencha com o seu CPF'
				value='{{ form.cpf }}'
				maxlength='14'
				required
				pattern='[0-9]{3}[\.][0-9]{3}[\.][0-9]{3}[-][0-9]{2}'
				onkeypress='mascaraCPF(this)' 
				oninput='setCustomValidity("")'
				oninvalid='setCustomValidity("Preencher com o formato padrao de CPF")' 
			/>
		</div>

		<div class='form-row'>
			<button type='button' class='btn btn-link' onclick='window.location.href=`{% url "login" %}`'>Voltar para inicio</button>
			<button type='submit' class='btn btn-success btn-lg btn-block'>Redefinir senha</button>
		</div>
</form>
{% endblock %}
