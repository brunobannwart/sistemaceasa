{% extends 'base.html' %}

{% block pagina %}

{% if erro is not None %}
	<div class='error-overlay' onclick='this.style.display="none"'>
		<div class='error-popup' onclick='this.parentElement.style.display="none"'>
			<h2>Aviso</h2>
			<button aria-label='Fechar' class='error-close'>&times;</button>
			<div class='error-content'>
				<p>{{ erro }}</p>
			</div>
		</div>
	</div>
{% endif %}

<div class='form'>
	<div class='card'>
		<div class='card-body'>
			<form method='post' action='.' autocomplete='off'>
				{% csrf_token %}
				<header>
					<strong>Formulário de Escola</strong>
				</header>

				{% if editar is True %}
					<input id='cep_valido' name='cep_valido' type='hidden' value='1' />
					<input id='estado_valido' name='estado_valido' type='hidden' value='1' />
				{% else %}
					<input id='cep_valido' name='cep_valido' type='hidden' value='0' />
					<input id='estado_valido' name='estado_valido' type='hidden' value='0' />
				{% endif %}

				<div class='form-group'>
					<label for='nome'>Nome</label>
					<input
						type='text'
						class='form-control'
						id='nome'
						name='nome'
						maxlength='100'
						value='{{ form.nome }}'
						placeholder='Preencha o nome da escola'
						required
						oninput='setCustomValidity("")'
						oninvalid='setCustomValidity("Preencher campo obrigatório")' 
					/>
				</div>
				<div class='form-row'>
					<div class='col'>
						<label for='rua'>Rua</label>
						<input
							type='text'
							class='form-control'
							name='rua'
							id='rua'
							maxlength='100'
							value='{{ form.rua }}'
							placeholder='Preencha com o nome da rua'
							required
							oninput='setCustomValidity("")'
							oninvalid='setCustomValidity("Preencher campo obrigatório")'
						/>
					</div>
					<div class='col'>
						<label for='numero'>Número</label>
						<input
							type='text'
							class='form-control'
							name='numero'
							id='numero'
							maxlength='10'
							pattern='[0-9]*'
							value='{{ form.numero }}'
							placeholder='Preencha com o número da rua'
							required
							oninput='setCustomValidity("")'
							oninvalid='setCustomValidity("Preencher campo obrigatório com apenas digitos")' 
						/>
					</div>
				</div>
				<div class='form-row' style='margin-top: 1em;'>
					<div class='col'>
						<label for='bairro'>Bairro</label>
						<input
							type='text'
							class='form-control'
							name='bairro'
							id='bairro'
							maxlength='100'
							value='{{ form.bairro }}'
							placeholder='Preencha com o nome do bairro'
							required
							oninput='setCustomValidity("")'
							oninvalid='setCustomValidity("Preencher campo obrigatório")'
						/>
					</div>
					<div class='col'>
						<label for='cidade'>Cidade</label>
						<input
							type='text'
							class='form-control'
							name='cidade'
							id='cidade'
							maxlength='100'
							value='{{ form.cidade }}'
							placeholder='Preencha com o nome da cidade'
							required
							oninput='setCustomValidity("")'
							oninvalid='setCustomValidity("Preencher campo obrigatório")' 
						/>
					</div>
				</div>
				<div class='form-row' style='margin-top: 1em;'>
					<div class='col'>
						<label for='estado'>Estado</label>
						<input
							type='text'
							class='form-control'
							name='estado'
							id='estado'
							maxlength='2'
							pattern='[A-Z]*'
							value='{{ form.estado }}'
							onchange='this.value = this.value.toUpperCase();'
							onblur='validarEstado(this)'
							oninput='setCustomValidity("")'
							oninvalid='setCustomValidity("Preencher campo obrigatório com a sigla")'  
							placeholder='Preencha com a sigla do estado'
							required
						/>
					</div>
					<div class='col'>
						<label for='cep'>CEP</label>
						<input
							type='text'
							class='form-control'
							name='cep'
							id='cep'
							maxlength='10'
							value='{{ form.cep }}'
							pattern='[0-9]{2}[\.][0-9]{3}[-][0-9]{3}'
							placeholder='Preencha com o número do cep'
							required
							onkeypress='mascaraCEP(this)'
							onblur='validarCEP(this)'
							oninput='setCustomValidity("")'
							oninvalid='setCustomValidity("Preencher campo obrigatório")'  
						/>
					</div>
				</div>
				<div class='form-group' style='margin-top: 1em;'>
					<label for='diretor'>Diretor(a)</label>
					<input
						type='text'
						class='form-control'
						id='diretor'
						name='diretor'
						maxlength='100'
						value='{{ form.diretor }}'
						placeholder='Preencha o nome do(a) diretor(a)'
						required
						oninput='setCustomValidity("")'
						oninvalid='setCustomValidity("Preencher campo obrigatório")'  
					/>
				</div>

				<div class='form-row'>
					<div class='col'>
						<button type='button' class='btn btn-danger btn-lg btn-block' onclick='window.location.href=`{% url "schoollist" %}`'>Cancelar</button>
					</div>
					<div class='col'>
						<button type='submit' class='btn btn-success btn-lg btn-block'>Salvar</button>
					</div>
				</div>
			</form>
		</div>
	</div>
</div>
{% endblock %}
